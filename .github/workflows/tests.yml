name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, dom, fileinfo, mysql, bcmath, gd, intl, xml, zip, pdo, sqlite
          tools: composer:v2
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Validate composer
        run: composer validate --no-check-all

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/testing
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Create SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit

  deploy:
    needs: laravel-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar vía SSH en iPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_CLOUDPOLIEDRO }}
          username: ${{ secrets.NAME_CLOUDPOLIEDRO }}
          key: ${{ secrets.SSH_PRIVATE_KEY_CLOUDPOLIEDRO }}
          port: 22
          script: |
            cd /home/sites/35a/1/165d81d6e0/testdeploy

            git pull origin main

            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/framework/testing
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            chmod -R 775 storage bootstrap/cache

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
